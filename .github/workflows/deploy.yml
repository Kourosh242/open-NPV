name: Test and deploy Open NPV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Superseded pull-request runs are cancelled (they only run tests), but a run on
# main is never cancelled: killing a deployment halfway through can leave the
# Pages environment reporting a failed/missing deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, unit tests and production build
        run: npm run check

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, offline and privacy tests
        run: npm run test:browser

      # Never publish an artifact that is missing its entry point or decoder:
      # a broken site that still deploys is worse than a failed workflow.
      - name: Verify the built site
        run: |
          for file in index.html app.js worker.js sw.js style.css source.zip demo.npvt icons/icon-192.png assets/Vazirmatn.woff2; do
            test -s "site/$file" || { echo "missing or empty: site/$file"; exit 1; }
          done
          grep -q 'open-npv' site/sw.js || { echo "service worker was not generated"; exit 1; }

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
